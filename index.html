<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>합격 응원 카드 만들기 | 국민대학교 논술고사</title>
<meta name="description" content="자녀에게 전할 응원 한마디를 카드로 만들어 저장하고 공유하세요.">
<meta property="og:title" content="합격 응원 카드 만들기">
<meta property="og:description" content="국민대학교 논술고사 학부모 라운지 이벤트 — 자녀에게 응원 카드를 보내 보세요.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0A2B5E">
<link rel="preload" href="fonts/KMU80HaeongSans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/KMU80SungkokSemiSerif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">

  <header class="head">
    <a class="back-link" id="backLink" hidden></a>
    <p class="eyebrow" id="eventLabel"></p>
    <h1 class="title" id="pageTitle"></h1>
  </header>

  <ol class="steps" aria-label="진행 단계">
    <li class="step is-done" data-step="1"><span>1</span>디자인</li>
    <li class="step-bar is-done" aria-hidden="true"></li>
    <li class="step is-current" data-step="2"><span>2</span>메시지</li>
    <li class="step-bar" aria-hidden="true"></li>
    <li class="step" data-step="3"><span>3</span>저장</li>
  </ol>

  <!-- ============ 1·2단계: 디자인 + 메시지 ============ -->
  <section id="screenWrite" class="screen" aria-label="응원 카드 꾸미기">

    <div class="field">
      <p class="label" id="designLabel">카드 디자인</p>
      <div class="designs" id="designs" role="group" aria-labelledby="designLabel"></div>
    </div>

    <div class="field">
      <label class="label" for="msg">자녀에게 전할 응원 메시지</label>
      <div class="chips" id="chips" aria-label="추천 문구"></div>
      <textarea id="msg" rows="3" placeholder="예) 지금까지 정말 잘해왔어. 오늘도 너답게!"></textarea>
      <div class="meta">
        <span id="msgHint"></span>
        <span class="count" id="msgCount">0 / 50자</span>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label class="label" for="to">받는 사람</label>
        <input id="to" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label class="label" for="from">보내는 사람</label>
        <input id="from" type="text" autocomplete="off">
      </div>
    </div>

    <p class="error" id="formError" role="alert" hidden></p>

    <div class="cta-wrap">
      <button type="button" class="btn btn-primary" id="btnMake">
        카드 만들기
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ 3단계: 저장 ============ -->
  <section id="screenDone" class="screen" aria-label="완성된 응원 카드" hidden>
    <figure class="result">
      <img id="resultImg" alt="완성된 합격 응원 카드">
      <figcaption id="saveHint">이미지를 길게 누르면 휴대폰에 바로 저장할 수 있어요</figcaption>
    </figure>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="btnSave">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg>
        이미지로 저장
      </button>
      <div class="actions-2">
        <button type="button" class="btn btn-line" id="btnShare">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4M8.2 13.2l7.6 4"/></svg>
          공유하기
        </button>
        <button type="button" class="btn btn-line" id="btnEdit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
          다시 꾸미기
        </button>
      </div>
      <button type="button" class="btn btn-text" id="btnNew">+ 새 카드 하나 더 만들기</button>
    </div>
  </section>

  <footer class="foot" id="footText"></footer>
</main>

<!-- 안내 모달 (인앱 브라우저 등 저장이 막힌 경우) -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">이미지를 길게 눌러 저장해 주세요</h2>
    <p id="modalBody">카카오톡·네이버 앱 안에서는 버튼으로 저장이 안 될 수 있어요. 카드 이미지를 길게 누른 뒤 <b>‘이미지 저장’</b>을 선택해 주세요.</p>
    <button type="button" class="btn btn-primary" id="modalClose">확인</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 숨김 캔버스(저장용 원본 1080×1440) -->
<canvas id="cardCanvas" hidden></canvas>

<script src="config.js"></script>
<script src="card.js"></script>
<script src="app.js"></script>
</body>
</html>
